analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
include: package:ilt_lints/lints.yaml

plugins:
  ilt_lints:
    diagnostics:
      export_library: true

export_library:
  - exporter: lib/file_ext.dart
    include:
      - lib/src/**/*.dart
    exclude:
      - "**/g.dart"
      - "**/freezed.dart"
